# Alembic configuration.
#
# NOTE: keep this file ASCII-only. alembic reads it with the *locale* codec
# (cp936 on a zh-CN Windows), so non-ASCII comments raise UnicodeDecodeError.
# Same constraint as requirements.txt.
#
# - script_location uses %(here)s (the directory holding this ini), so
#   `python -m alembic ...` works from any working directory.
# - sqlalchemy.url is intentionally EMPTY: migrations/env.py builds the URL from
#   app.config.settings (or -x db_url=...), so credentials never live in the repo.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Windows drive letters contain a colon (D:\...), so declare the os separator
# explicitly; the legacy splitter would otherwise break the path apart.
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
